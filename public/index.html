<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><title>Ice Arena</title><style>
:root{--sub:#94969b;--border:rgba(255,255,255,.08);}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#0b0c0e;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
body{overflow:hidden;}
.ice-screen{position:fixed;inset:0;width:100%;height:100%;z-index:60;display:flex;flex-direction:column;background:#101113;}
.playhub-back{width:38px;height:38px;border:1px solid var(--border);border-radius:50%;background:#22252b;color:#fff;font-size:18px;cursor:pointer;flex:0 0 auto;}
.playhub-balance{display:flex;align-items:center;gap:5px;padding:7px 10px;border:1px solid var(--border);border-radius:14px;background:#1b1d21;font-size:12px;font-weight:800;}
.ton-icon{width:15px;height:15px;border-radius:50%;background:#3390ec;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;}
.balance-val{font-weight:800;}
@keyframes hubIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .ice-screen{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;background:#101113;}.ice-screen.active{display:flex;animation:hubIn .2s ease-out;}.ice-topbar{display:flex;align-items:center;gap:10px;padding:16px max(16px,calc((100% - 480px)/2));flex:0 0 auto;}.ice-title{flex:1;}.ice-title strong{display:block;font-size:17px;letter-spacing:-.2px;}.ice-title small{display:block;margin-top:2px;color:#b8bdc2;font-size:10px;}.ice-title i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#44d7f2;box-shadow:0 0 8px #44d7f2;vertical-align:middle;}.ice-body{flex:1 1 auto;min-height:0;padding:2px max(16px,calc((100% - 480px)/2)) calc(30px + env(safe-area-inset-bottom,0px));overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}.ice-stats{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:6px;margin:5px 0 12px;}.ice-stats>div{padding:10px 9px;border:1px solid var(--border);border-radius:13px;background:#1a1d21;min-width:0;}.ice-stats span{display:block;color:var(--sub);font-size:8px;letter-spacing:.3px;}.ice-stats b{display:block;margin-top:5px;color:#e9faff;font-size:11px;white-space:nowrap;}.ice-stats>div:nth-child(2){background:linear-gradient(135deg,#173c48,#193945);}.ice-stats>div:nth-child(2) b{color:#5fe5ff;}.ice-arena-shell{position:relative;overflow:hidden;border:1px solid rgba(171,240,255,.28);border-radius:20px;background:#061820;box-shadow:inset 0 0 35px rgba(34,209,255,.13);}.ice-arena{position:relative;width:100%;aspect-ratio:1.23;overflow:hidden;background:#101418;transform-origin:center;transition:transform 1.5s cubic-bezier(.17,.84,.28,1);}.ice-arena:before{content:'';position:absolute;inset:8px;border:1px solid rgba(207,250,255,.3);border-radius:14px;pointer-events:none;z-index:2;}.ice-rink-line{position:absolute;left:50%;top:8px;bottom:8px;width:2px;background:rgba(234,255,255,.34);z-index:2;}.ice-rink-line:after{content:'';position:absolute;width:70px;height:70px;border:1px solid rgba(234,255,255,.25);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);}.ice-zone{position:absolute;top:0;bottom:0;transition:width .35s ease;overflow:hidden;}.ice-zone:after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.13),transparent 55%);}.ice-zone span{position:absolute;left:10px;bottom:9px;z-index:1;font-size:10px;font-weight:800;color:rgba(255,255,255,.86);text-shadow:0 1px 3px rgba(0,0,0,.45);}.ice-zone em{font-style:normal;color:rgba(255,255,255,.64);font-weight:600;}.ice-winner{position:absolute;z-index:7;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s;}.ice-winner.show{opacity:1;background:rgba(3,12,16,.36);}.ice-winner div{padding:12px 16px;border:1px solid rgba(255,255,255,.22);border-radius:16px;background:rgba(14,18,21,.85);text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.35);}.ice-winner b{display:block;font-size:17px;}.ice-winner small{display:block;margin-top:3px;color:#bceef8;font-size:11px;}.ice-legend{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:11px 0 13px;}.ice-player{display:flex;align-items:center;gap:7px;padding:8px;border:1px solid var(--border);border-radius:12px;background:#1a1d21;min-width:0;}.ice-player i{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}.ice-player span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;font-weight:700;flex:1;}.ice-player b{font-size:10px;}.ice-controls{padding:13px;border:1px solid var(--border);border-radius:17px;background:#191b1f;}.ice-stake-label{display:flex;justify-content:space-between;color:var(--sub);font-size:11px;}.ice-stake-label strong{color:#fff;}.ice-stakes{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px;}.ice-stakes button{padding:9px 2px;border:1px solid var(--border);border-radius:10px;background:#25282e;color:#aeb4ba;font:700 11px inherit;cursor:pointer;}.ice-stakes button.active{border-color:rgba(94,226,255,.55);background:#17475a;color:#c7f7ff;}.ice-join,.ice-start{width:100%;margin-top:10px;border:0;border-radius:12px;padding:12px;color:#071218;font:800 13px inherit;cursor:pointer;}.ice-join{background:linear-gradient(135deg,#65e5ff,#40b8dc);}.ice-start{display:none;background:#2b3035;color:#fff;}.ice-start.visible{display:block;}.ice-hint{margin:11px 6px;color:var(--sub);font-size:10px;line-height:1.4;text-align:center;}
    /* The local player sees only their own territory framed in white. */
    .ice-zone.mine{z-index:3;box-shadow:inset 0 0 0 2px #fff,0 0 12px rgba(255,255,255,.4);}
    .ice-zone.mine:before{content:'';position:absolute;inset:4px;border:1px solid rgba(255,255,255,.72);border-radius:5px;pointer-events:none;z-index:2;}
    /* A clean weighted mosaic always fills the rink without gaps or overflow. */
    .ice-rink-line,.ice-arena:before{display:none;}.ice-arena-shell{border-radius:0;box-shadow:none;}.ice-arena{aspect-ratio:1;border-radius:0;}.ice-zone-map{position:absolute;inset:0;z-index:1;overflow:hidden;}.ice-zone{right:auto!important;bottom:auto!important;clip-path:none!important;box-sizing:border-box;transition:left .35s ease,top .35s ease,width .35s ease,height .35s ease,background .35s ease;}.ice-zone span{left:50%!important;bottom:auto!important;top:50%;width:76px;transform:translate(-50%,-50%);text-align:center;line-height:1.15;}.ice-zone.mine{box-shadow:inset 0 0 0 2px #fff,0 0 9px rgba(255,255,255,.5);filter:none;}.ice-zone.mine:before{inset:4px;border:1px solid rgba(255,255,255,.75);border-radius:0;}
    .ice-bet-modal{position:absolute;z-index:70;inset:0;display:none;align-items:flex-end;background:rgba(0,0,0,.56);}.ice-bet-modal.show{display:flex;}.ice-bet-sheet{width:100%;padding:15px 16px 22px;border-radius:22px 22px 0 0;background:#1a1d21;box-shadow:0 -12px 30px rgba(0,0,0,.3);}.ice-bet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;font-size:17px;font-weight:800;}.ice-bet-close{width:29px;height:29px;border:0;border-radius:50%;background:#2c3036;color:#fff;font-size:20px;cursor:pointer;}.ice-bet-field{display:block;margin:10px 0 6px;color:#aeb7be;font-size:11px;font-weight:700;}.ice-bet-field input{box-sizing:border-box;width:100%;margin-top:6px;padding:12px;border:1px solid #353a41;border-radius:11px;background:#101215;color:#fff;font:700 14px inherit;outline:none;}.ice-bet-mine{display:flex;align-items:center;gap:8px;margin-top:14px;color:#dbe5e9;font-size:12px;}.ice-bet-confirm{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#65e5ff,#40b8dc);color:#071218;font:800 14px inherit;cursor:pointer;}
    
    /* End-of-round state: losing zones fade while the winning territory remains alive. */
    .ice-arena-shell{border-radius:20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}.ice-arena{border-radius:18px;}.ice-zone{border:1px solid rgba(7,17,20,.7);}.ice-zone.loser{filter:brightness(.28) saturate(.65);}.ice-zone.winner-zone{z-index:2;}.ice-winner.show{background:transparent;}.ice-winner div{padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;text-shadow:0 2px 5px rgba(0,0,0,.7);transform:translateY(38px);}.ice-winner b{font-size:14px;}.ice-winner small{color:#fff;font-weight:700;}
    /* ===== Ice Arena: puck appear + arrow orbiting around it (анимацией управляет client.js) ===== */
    .ice-puck{position:absolute;z-index:5;left:0;top:0;width:24px;height:24px;transform:translate3d(0,0,0);pointer-events:none;}
    .puck-img{position:absolute;left:-12px;top:-12px;width:48px;height:48px;display:block;user-select:none;-webkit-user-drag:none;transform-origin:50% 50%;will-change:transform,opacity;}
    .puck-ripple{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.75);box-shadow:0 0 12px rgba(150,235,255,.5);opacity:0;transform:translate(-50%,-50%) scale(.7);will-change:transform,opacity;}
    /* .ice-arrow: нулевой бокс ровно в центре шайбы — вращаем его, и стрелка облетает шайбу по кругу */
    .ice-arrow{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0;will-change:transform,opacity;}
    .ice-arrow svg{position:absolute;left:-7px;top:-37px;width:14px;height:20px;overflow:visible;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)) drop-shadow(0 0 5px rgba(255,255,255,.55));}
    /* Zones: organic weighted-Voronoi cells, area = stake share */
    .zone-item{position:absolute;inset:0;transition:opacity .35s ease;}
    .zone-item svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
    .zone-item polygon{stroke:rgba(7,17,20,.7);stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-linejoin:round;}
    .zone-item.mine{z-index:3;filter:drop-shadow(0 0 5px rgba(255,255,255,.55));}.zone-item.mine polygon{stroke:#fff;stroke-width:2.5;}
    .zone-item.winner-zone{z-index:4;}.zone-item.winner-zone polygon{stroke:#fff;stroke-width:2;}
    .zone-item.loser{opacity:.28;}
    .zone-label{position:absolute;transform:translate(-50%,-50%);width:max-content;max-width:76px;text-align:center;font-size:10px;font-weight:800;line-height:1.15;color:rgba(255,255,255,.92);text-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none;}
    .zone-label.small{font-size:9px;}.zone-label em{font-style:normal;color:rgba(255,255,255,.65);font-weight:600;}


.zone-av{position:absolute;transform:translate(-50%,-50%);border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.45);pointer-events:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:#2b3035}
.lg-av{border-radius:50%;object-fit:cover;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.ice-join:disabled{opacity:.45;cursor:not-allowed}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:90;max-width:88%;padding:10px 14px;border-radius:12px;background:#23272d;border:1px solid var(--border);font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
.toast.show{opacity:1}
.adm-list{max-height:200px;overflow:auto;margin-top:12px}
.adm-row{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:10px;background:#101215;margin-bottom:6px;cursor:pointer;font-size:13px;font-weight:700}
.adm-row small{display:block;color:#7c838a;font-size:10px;font-weight:600;margin-top:2px}

/* ===== Premium Ice Arena redesign — gameplay / puck styles intentionally untouched ===== */
:root{
  --bg:#070a0f;
  --panel:rgba(17,23,31,.78);
  --panel2:rgba(22,30,40,.9);
  --line:rgba(184,229,255,.12);
  --sub:#8e9aa8;
  --ice:#b9f1ff;
}
html,body{background:#06090e;}
.ice-screen{
  background:
    radial-gradient(900px 500px at 50% -10%,rgba(69,184,255,.13),transparent 65%),
    radial-gradient(600px 500px at 100% 60%,rgba(82,108,255,.07),transparent 70%),
    linear-gradient(180deg,#080b11 0%,#0b1017 55%,#070a0f 100%);
}
.ice-screen:before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.28;
  background-image:radial-gradient(rgba(255,255,255,.16) .6px,transparent .6px);
  background-size:18px 18px;mask-image:linear-gradient(to bottom,black,transparent 80%);
}
.ice-topbar{
  position:relative;z-index:2;padding-top:18px;padding-bottom:13px;
  border-bottom:1px solid rgba(255,255,255,.045);
  background:linear-gradient(180deg,rgba(7,10,15,.88),rgba(7,10,15,.35));
  backdrop-filter:blur(18px);
}
.playhub-back{
  width:40px;height:40px;border-radius:13px;
  border:1px solid rgba(188,231,255,.13);
  background:linear-gradient(145deg,rgba(34,46,60,.9),rgba(17,23,31,.9));
  box-shadow:0 8px 22px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.06);
}
.playhub-back:hover{background:#253443;}
.ice-title strong{font-size:18px;letter-spacing:-.45px;}
.ice-title small{color:#8795a4;margin-top:4px;}
.ice-title i{background:#67e6ff;box-shadow:0 0 10px #67e6ff;}
.playhub-balance{
  padding:8px 11px;border-radius:13px;
  background:rgba(21,29,39,.82);
  border:1px solid rgba(188,231,255,.12);
  box-shadow:inset 0 1px rgba(255,255,255,.05);
}
.ton-icon{background:linear-gradient(145deg,#52b9ff,#2678d9);box-shadow:0 0 12px rgba(53,151,255,.25);}
.ice-body{position:relative;z-index:1;padding-top:14px;}
.ice-stats{gap:9px;margin:4px 0 14px;}
.ice-stats>div{
  padding:11px 10px;border-radius:15px;
  border:1px solid rgba(185,225,255,.095);
  background:linear-gradient(145deg,rgba(24,32,42,.82),rgba(13,18,25,.82));
  box-shadow:0 10px 24px rgba(0,0,0,.14),inset 0 1px rgba(255,255,255,.035);
}
.ice-stats span{color:#738293;font-size:8px;font-weight:700;}
.ice-stats b{color:#e8f7ff;font-size:11px;}
.ice-stats>div:nth-child(2){
  background:linear-gradient(145deg,rgba(18,62,83,.88),rgba(15,35,51,.88));
  border-color:rgba(87,214,255,.18);
  box-shadow:0 10px 28px rgba(26,170,230,.08),inset 0 1px rgba(255,255,255,.05);
}
.ice-stats>div:nth-child(2) b{color:#73e7ff;}
.ice-arena-shell{
  border-radius:23px;
  border:1px solid rgba(157,225,255,.2);
  background:linear-gradient(145deg,#0a202b,#071219);
  box-shadow:
    0 24px 55px rgba(0,0,0,.38),
    0 0 0 5px rgba(104,208,255,.025),
    inset 0 0 45px rgba(42,191,244,.11),
    inset 0 1px rgba(255,255,255,.08);
}
.ice-arena{border-radius:21px;background:#0d141b;}
.ice-zone-map{filter:saturate(.88) brightness(.88);}
.zone-item polygon{stroke:rgba(226,248,255,.16);stroke-width:1.2;}
.zone-item.mine polygon{stroke:#f5fdff;stroke-width:2.4;}
.zone-item.mine{filter:drop-shadow(0 0 7px rgba(170,239,255,.32));}
.zone-av{
  border-color:rgba(255,255,255,.78);
  box-shadow:0 3px 14px rgba(0,0,0,.45),0 0 0 3px rgba(255,255,255,.04);
}
.ice-controls{
  margin-top:14px;padding:15px;border-radius:19px;
  border:1px solid rgba(185,225,255,.1);
  background:linear-gradient(145deg,rgba(23,31,41,.88),rgba(12,17,24,.9));
  box-shadow:0 15px 34px rgba(0,0,0,.2),inset 0 1px rgba(255,255,255,.04);
}
.ice-stake-label{color:#82909f;}
.ice-stake-label strong{color:#eaf8ff;}
.ice-stakes{gap:8px;margin-top:11px;}
.ice-stakes button{
  padding:10px 2px;border-radius:11px;
  background:rgba(38,48,60,.78);
  border-color:rgba(185,225,255,.09);
  color:#aab8c5;
  transition:.18s ease;
}
.ice-stakes button:hover{transform:translateY(-1px);background:#2d3a48;color:#e9f8ff;}
.ice-stakes button.active{
  border-color:rgba(101,224,255,.48);
  background:linear-gradient(145deg,#164b61,#123746);
  color:#c9f8ff;
  box-shadow:0 0 18px rgba(60,207,255,.1),inset 0 1px rgba(255,255,255,.08);
}
.ice-bet-field input{
  border-color:rgba(185,225,255,.1);
  background:rgba(6,10,15,.72);
  border-radius:12px;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.18);
}
.ice-join{
  padding:13px;border-radius:13px;
  background:linear-gradient(135deg,#75eaff,#37b9e1 55%,#2d9bc7);
  box-shadow:0 8px 24px rgba(42,186,225,.2),inset 0 1px rgba(255,255,255,.35);
  transition:.18s ease;
}
.ice-join:hover{transform:translateY(-1px);filter:brightness(1.06);}
.ice-join:disabled{filter:saturate(.5);}
.ice-legend{gap:8px;margin:13px 0 14px;}
.ice-player{
  padding:9px;border-radius:13px;
  border-color:rgba(185,225,255,.08);
  background:linear-gradient(145deg,rgba(24,32,42,.78),rgba(13,18,25,.78));
  box-shadow:inset 0 1px rgba(255,255,255,.025);
}
.ice-player b{color:#d9e9f2;}
.ice-hint{color:#6f7d8b;margin-top:12px;}
.ice-winner b{letter-spacing:-.2px;}
.toast{background:rgba(18,25,33,.94);border-color:rgba(130,213,255,.16);box-shadow:0 12px 30px rgba(0,0,0,.3);}

</style></head><body><div class="ice-screen active" id="iceScreen">
  <div class="ice-topbar">
    <button class="playhub-back" id="adminBtn" style="visibility:hidden" aria-label="Админка">⚙</button>

    <div class="ice-controls"><div class="ice-stake-label">Ставка, TON <strong id="stakeInfo"></strong></div>

    <div class="adm-list" id="adminList"></div></div></div>
  <div class="toast" id="toast"></div>
</div>
